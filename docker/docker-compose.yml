# docker-compose.yml — DenymStyle v2.0
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ds-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: denymstyle2026
      MYSQL_DATABASE: denymstyle
      MYSQL_USER: dsuser
      MYSQL_PASSWORD: dspass2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/denymstyle.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - denymnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ds-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: dsuser
      DB_PASSWORD: dspass2026
      DB_NAME: denymstyle
      JWT_SECRET: denymstyle_jwt_2026_prod
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - denymnet
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ds-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - denymnet
    environment:
      REACT_APP_API_URL: http://localhost:5000/api

volumes:
  mysql_data:

networks:
  denymnet:
    driver: bridge
