# ══════════════════════════════════════
# DENYMSTYLE — Kubernetes Manifests
# kubectl apply -f kubernetes.yml
# ══════════════════════════════════════

# NAMESPACE
apiVersion: v1
kind: Namespace
metadata:
  name: denymstyle
---
# SECRET
apiVersion: v1
kind: Secret
metadata:
  name: ds-secrets
  namespace: denymstyle
type: Opaque
stringData:
  DB_PASSWORD: "denymstyle2026"
  JWT_SECRET: "denymstyle_jwt_k8s_2026_prod"
  ANTHROPIC_API_KEY: "sk-ant-xxxxx"
---
# MYSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: denymstyle
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# MYSQL DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: denymstyle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ds-secrets
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: "denymstyle"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: denymstyle
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
---
# BACKEND DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-api
  namespace: denymstyle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ds-api
  template:
    metadata:
      labels:
        app: ds-api
    spec:
      containers:
      - name: api
        image: denymstyle-api:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "mysql-service"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ds-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          value: "denymstyle"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ds-secrets
              key: JWT_SECRET
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: denymstyle
spec:
  selector:
    app: ds-api
  ports:
  - port: 5000
    targetPort: 5000
---
# FRONTEND DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-web
  namespace: denymstyle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ds-web
  template:
    metadata:
      labels:
        app: ds-web
    spec:
      containers:
      - name: web
        image: denymstyle-web:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: denymstyle
spec:
  type: LoadBalancer
  selector:
    app: ds-web
  ports:
  - port: 80
    targetPort: 80
---
# INGRESS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ds-ingress
  namespace: denymstyle
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: denymstyle.bo
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
